version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: algomentor-backend
    env_file:
      - ./backend/.env
    ports:
      - '8000:8000'
    depends_on:
      - postgres
      - redis
      - qdrant
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: algomentor-frontend
    ports:
      - '5173:5173'
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: algomentor-postgres
    environment:
      POSTGRES_DB: algomentor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: algomentor-redis
    ports:
      - '6379:6379'

  qdrant:
    image: qdrant/qdrant:latest
    container_name: algomentor-qdrant
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
volumes:
  postgres_data:
  qdrant_data:
